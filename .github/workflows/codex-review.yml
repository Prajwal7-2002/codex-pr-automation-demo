name: LLaMA PR Review on Main

on:
  push:
    branches:
      - main

jobs:
  llama-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Extract latest diff
        run: |
          git diff HEAD~1 HEAD > diff.txt

      - name: Run LLaMA Review
        run: python codex_review.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Show Review Output
        run: cat review.txt
