name: Codex Review on Main

on:
  push:
    branches:
      - main

jobs:
  codex-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest diff
        run: |
          git diff HEAD~1 HEAD > diff.txt

      - name: Run Codex Review
        run: python codex_review.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Show Codex Output
        run: cat review.txt
